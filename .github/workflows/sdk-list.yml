name: Lister les images Android

on:
  push:
    branches: [main]
    paths: [.github/workflows/sdk-list.yml]

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list --channel=3 2>/dev/null | grep -E "android-3[6-9]|CANARY|Baklava|Cinnamon" | sort -u | head -60
