name: Tester l'installation

# Installe la dernière version publiée sur un vrai Android (émulateur) et lance l'appli,
# pour voir l'erreur exacte si l'installation échoue.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/install-test.yml]
  workflow_run:
    workflows: ["Construire l'APK"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 35, target: google_apis }
          - { api: 36, target: google_apis_playstore }
    steps:
      - name: Récupérer l'APK publié (et la version 2.0.0 pour tester la mise à jour)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download derniere-version -R "$GITHUB_REPOSITORY" -p zhuzi.apk
          gh run download 45932025624 -R "$GITHUB_REPOSITORY" -n zhuzi-apk -D old || true
          ls -la zhuzi.apk old || true
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer et lancer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: |
            echo "== installation neuve"; adb install zhuzi.apk; echo "resultat neuve: $?"
            adb uninstall com.zhuzi.app || true
            if [ -f old/app-debug.apk ]; then echo "== 2.0.0 puis mise a jour"; adb install old/app-debug.apk; echo "resultat 2.0.0: $?"; adb install -r zhuzi.apk; echo "resultat mise a jour: $?"; fi
            adb shell dumpsys package com.zhuzi.app | grep -E "versionName|versionCode" || echo "PAS INSTALLEE"
            adb logcat -c
            adb shell monkey -p com.zhuzi.app -c android.intent.category.LAUNCHER 1 || true
            sleep 15
            adb shell pidof com.zhuzi.app && echo "APPLI LANCEE" || echo "APPLI ARRETEE"
            adb logcat -d -b crash || true

  # Android 17 (images « android-37.0 ») : émulateur lancé à la main
  android17:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, google_apis_playstore]
    steps:
      - name: Récupérer les APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download derniere-version -R "$GITHUB_REPOSITORY" -p zhuzi.apk
          gh run download 45932025624 -R "$GITHUB_REPOSITORY" -n zhuzi-apk -D old || true
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer et lancer sur Android 17
        run: |
          SDK=$ANDROID_HOME/cmdline-tools/latest/bin
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_AVD_HOME=$HOME/.android/avd; mkdir -p $ANDROID_AVD_HOME
          IMG=$($SDK/sdkmanager --list 2>/dev/null | grep -oE "system-images;android-37[.0-9]*;${{ matrix.target }};x86_64" | sort -u | head -1)
          echo "image: $IMG"
          yes | $SDK/sdkmanager "$IMG" emulator platform-tools >/dev/null
          echo no | $SDK/avdmanager create avd -n t -k "$IMG" -d pixel_6 --force
          $ANDROID_HOME/emulator/emulator -avd t -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics &
          adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 5; done
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          echo "== installation neuve"; adb install zhuzi.apk; echo "resultat neuve: $?"
          adb uninstall com.zhuzi.app || true
          if [ -f old/app-debug.apk ]; then echo "== 2.0.0 puis mise a jour"; adb install old/app-debug.apk; echo "resultat 2.0.0: $?"; adb install -r zhuzi.apk; echo "resultat mise a jour: $?"; fi
          adb shell dumpsys package com.zhuzi.app | grep -E "versionName" || echo "PAS INSTALLEE"
          adb logcat -c
          adb shell monkey -p com.zhuzi.app -c android.intent.category.LAUNCHER 1 || true
          sleep 20
          adb shell pidof com.zhuzi.app && echo "APPLI LANCEE" || echo "APPLI ARRETEE"
          adb logcat -d -b crash || true
          # Notifications appli fermée : alarmes programmées, puis alarme déclenchée appli tuée
          echo "== alarmes programmees"; adb shell dumpsys alarm | grep -A2 "com.zhuzi.app" | grep -E "ALARM_|tag=|when" | head -10
          adb shell pm grant com.zhuzi.app android.permission.POST_NOTIFICATIONS || true
          adb shell input keyevent KEYCODE_HOME; sleep 2
          adb shell am kill com.zhuzi.app; sleep 2
          adb shell pidof com.zhuzi.app && echo "APPLI ENCORE OUVERTE" || echo "APPLI FERMEE"
          if adb root >/dev/null 2>&1; then
            sleep 3
            adb shell am broadcast -n com.zhuzi.app/.reminder.AlarmReceiver -a com.zhuzi.app.ALARM_WORD
            sleep 5
            adb shell dumpsys notification --noredact | grep -E "pkg=com.zhuzi.app|android.title=|android.text=" | head -8 || true
            adb shell dumpsys notification | grep -q "pkg=com.zhuzi.app" && echo "NOTIFICATION AFFICHEE" || echo "PAS DE NOTIFICATION"
            adb unroot >/dev/null 2>&1 || true; sleep 3
          fi
          # comme sur le téléphone : installation par l'installeur du système (session), pas par adb
          adb uninstall com.zhuzi.app || true
          adb push zhuzi.apk /data/local/tmp/z.apk
          S=$(adb shell pm install-create -i com.android.vending | grep -oE "[0-9]+")
          adb shell pm install-write $S base /data/local/tmp/z.apk
          adb shell pm install-commit $S; echo "resultat session: $?"
          adb emu kill || true
