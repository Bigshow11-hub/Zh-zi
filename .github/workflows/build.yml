name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Construire
        run: ./gradlew assembleDebug --no-daemon
      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: zhuzi-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Sur main : remplace le fichier du lien fixe
      # https://github.com/Bigshow11-hub/Zh-zi/releases/latest/download/zhuzi.apk
      - name: Publier la dernière version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk zhuzi.apk
          gh release delete derniere-version --cleanup-tag --yes || true
          gh release create derniere-version zhuzi.apk \
            --target "$GITHUB_SHA" \
            --title "Zhúzi – dernière version" \
            --notes "Version construite automatiquement le $(date -u '+%d/%m/%Y à %H:%M') (UTC)."
