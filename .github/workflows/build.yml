name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric (tests et photos d'écran) télécharge Android une fois : gardé d'une construction à l'autre
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Construire
        run: ./gradlew assembleDebug --no-daemon
      # Tests de la révision espacée et de la série : s'ils échouent, rien n'est publié
      - name: Tester la révision et la série
        run: |
          for i in 1 2 3; do
            ./gradlew testDebugUnitTest --tests '*LearningTest*' --no-daemon && exit 0
            sleep 20
          done
          exit 1
      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: zhuzi-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Photos des écrans (ne bloque jamais la publication de l'APK)
      - name: Photographier les écrans
        continue-on-error: true
        # Une seconde tentative si un téléchargement échoue (Robolectric télécharge Android au premier lancement)
        run: |
          ./gradlew testDebugUnitTest --tests '*ScreenshotTest*' --no-daemon || \
            ./gradlew testDebugUnitTest --tests '*ScreenshotTest*' --no-daemon
      - name: Mettre les photos à disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhuzi-ecrans
          path: app/build/screens/*.png
          if-no-files-found: ignore
      # Version « release » réduite par R8 (non signée) : vérifie seulement qu'elle se construit
      - name: Vérifier la version réduite (R8)
        continue-on-error: true
        run: ./gradlew assembleRelease --no-daemon
      # Sur main : publie la nouvelle version au lien fixe
      # https://github.com/Bigshow11-hub/Zh-zi/releases/latest/download/zhuzi.apk
      - name: Publier la dernière version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk zhuzi.apk
          # version.json : lu par l'appli pour proposer la mise à jour
          CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$CODE" "$NAME" > version.json
          cat version.json
          # Une publication par version (v2.8.1…), jamais remplacée : le lien fixe ne peut plus donner
          # un fichier incomplet. Elle est préparée en brouillon, puis publiée d'un coup, APK compris.
          TAG="v$NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $NAME déjà publiée : le lien ne change pas (augmenter versionCode pour publier)."
          else
            gh release create "$TAG" zhuzi.apk version.json --draft \
              --target "$GITHUB_SHA" \
              --title "Zhúzi $NAME" \
              --notes "Version $NAME, construite le $(date -u '+%d/%m/%Y à %H:%M') (UTC)."
            gh release edit "$TAG" --draft=false --latest
            # l'ancienne publication unique, remplacée à chaque envoi, n'est plus utilisée
            gh release delete derniere-version --cleanup-tag --yes || true
          fi
          # Les photos d'écran : dans une préversion à part (jamais celle du lien de l'APK)
          if ls app/build/screens/*.png >/dev/null 2>&1; then
            gh release view ecrans >/dev/null 2>&1 || \
              gh release create ecrans --prerelease --latest=false --target "$GITHUB_SHA" \
                --title "Photos d'écran (dernière construction)" --notes "Photos d'écran faites par les tests."
            gh release upload ecrans app/build/screens/*.png --clobber
          fi
