name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Construire
        run: ./gradlew assembleDebug --no-daemon
      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: zhuzi-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Photos des écrans (ne bloque jamais la publication de l'APK)
      - name: Photographier les écrans
        continue-on-error: true
        # Une seconde tentative si un téléchargement échoue (Robolectric télécharge Android au premier lancement)
        run: |
          ./gradlew testDebugUnitTest --tests '*ScreenshotTest*' --no-daemon || \
            ./gradlew testDebugUnitTest --tests '*ScreenshotTest*' --no-daemon
      - name: Mettre les photos à disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhuzi-ecrans
          path: app/build/screens/*.png
          if-no-files-found: ignore
      # Branche de design : les photos vont dans une préversion à part (pas dans « dernière version »),
      # pour pouvoir les regarder depuis une session cloud (les artefacts n'y sont pas accessibles).
      - name: Publier les photos de la branche design-ios
        if: github.ref == 'refs/heads/design-ios'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls app/build/screens/*.png >/dev/null 2>&1; then
            gh release view ecrans-design-ios >/dev/null 2>&1 || \
              gh release create ecrans-design-ios --prerelease --target "$GITHUB_SHA" \
                --title "Photos d'écran (branche design-ios)" --notes "Préversion de travail : photos d'écran de la branche design-ios."
            gh release upload ecrans-design-ios app/build/screens/*.png --clobber
          fi
      # Sur main : remplace le fichier du lien fixe
      # https://github.com/Bigshow11-hub/Zh-zi/releases/latest/download/zhuzi.apk
      - name: Publier la dernière version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk zhuzi.apk
          gh release delete derniere-version --cleanup-tag --yes || true
          gh release create derniere-version zhuzi.apk \
            --target "$GITHUB_SHA" \
            --title "Zhúzi – dernière version" \
            --notes "Version construite automatiquement le $(date -u '+%d/%m/%Y à %H:%M') (UTC)."
          # Les photos d'écran, à côté de l'APK
          if ls app/build/screens/*.png >/dev/null 2>&1; then
            gh release upload derniere-version app/build/screens/*.png --clobber
          fi
